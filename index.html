<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pong</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="game-shell">
      <h1>Pong</h1>
      <p class="controls">Move your mouse over the game or use ↑ / ↓ to move the left paddle.</p>

      <div class="canvas-wrap">
        <canvas id="gameCanvas" width="900" height="520" aria-label="Pong game"></canvas>
      </div>

      <button id="restartBtn" type="button">Restart</button>
    </main>

    <script src="script.js"></script>
  </body>
</html>
